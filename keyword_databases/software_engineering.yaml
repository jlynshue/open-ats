# Used by the keyword analyzer (Sprint 5) when --industry software-engineering
# is specified, or when auto-detection identifies an SWE-flavored JD.
#
# This is intentionally a seed (~70 entries). Sprint 5+ will expand it based
# on real JD samples and contributor PRs. Keep entries deduplicated and avoid
# vendor-specific marketing names that change frequently.

