# Hand-annotated keyword golden set for the JD parser (FR-2, Sprint 4).
#
# Each fixture has a flat list of keywords we consider true positives —
# real ATS-relevant signals that a resume scanner should be aware of.
# Comparison is case-insensitive: an extracted candidate is a hit if its
# casefolded value matches any entry below (also casefolded).
#
# Precision rule (Sprint 4 grading threshold #5):
#   precision = |golden ∩ extracted| / |extracted|  ≥ 0.80
#
# Recall sanity (threshold #6):
#   recall = |golden ∩ extracted| / |golden|  ≥ 0.40
#
# Editing principle: keep the bar reasonable. Include real tech terms,
# acronyms tied to the role, methodologies, and role-relevant
# hyphenated compounds. Include company names (we extract them as a
# byproduct of body-mention; not strictly an ATS keyword but not a bug
# either). Exclude single English words that are capitalised purely
# because they sit at sentence start.

