[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ats-scanner"
version = "0.1.0"
description = "Transparent, unlimited, open-source ATS resume scanning tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jonathan Lyn-Shue", email = "jonathan.lynshue@gmail.com"}
]
maintainers = [
    {name = "Jonathan Lyn-Shue", email = "jonathan.lynshue@gmail.com"}
]
keywords = ["ats", "resume", "scanner", "job-search", "career"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",           # CLI framework
    "pydantic[email]>=2.0.0", # Data validation (email-validator for EmailStr)
    "spacy>=3.7.0",           # NLP
    "nltk>=3.8.0",            # NLP
    "python-docx>=1.1.0",     # DOCX parsing
    "pdfplumber>=0.10.0",     # PDF parsing
    "jinja2>=3.1.0",          # HTML templating
    "pyyaml>=6.0",            # Config files
    "pandas>=2.0.0",          # Data analysis
    "rich>=13.0.0",           # Terminal UI
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
]
pdf = [
    "weasyprint>=60.0",       # HTML to PDF conversion
]

[project.urls]
Homepage = "https://github.com/jlynshue/open-ats"
Documentation = "https://github.com/jlynshue/open-ats/tree/main/docs"
Repository = "https://github.com/jlynshue/open-ats"
Issues = "https://github.com/jlynshue/open-ats/issues"

[project.scripts]
open-ats = "open_ats.cli.main:cli"

[tool.setuptools]
packages = ["open_ats"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmarks",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "spacy.*",
    "nltk.*",
    "pdfplumber.*",
]
ignore_missing_imports = true
